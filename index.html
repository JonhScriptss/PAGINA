<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gran Colombia RP</title>
  <style>
    body {
      background-color: #0b0b0b;
      font-family: Arial, sans-serif;
      color: white;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #111;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .title-span:nth-child(1) { color: yellow; }
    .title-span:nth-child(2) { color: #00c3ff; }
    .title-span:nth-child(3) { color: red; }

    .buttons {
      display: flex;
      gap: 10px;
    }

    .login-btn, .register-btn {
      background-color: #00c3ff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      box-shadow: 0 0 10px #00c3ff;
    }

    .container {
      padding: 40px 20px;
      text-align: center;
    }

    .info {
      font-size: 1.1rem;
      margin: 10px 0;
    }

    .highlight {
      color: #00ffcc;
      font-weight: bold;
    }

    .welcome {
      margin-top: 30px;
      font-size: 1.3rem;
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffcc;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
    }

    .modal-content {
      background-color: #111;
      margin: 10% auto;
      padding: 30px;
      border: 1px solid #00c3ff;
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 0 15px #00c3ff;
      text-align: center;
    }

    input[type="text"], input[type="password"] {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
    }

    .modal button {
      background-color: #00c3ff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 10px #00c3ff;
    }

    .close {
      color: white;
      float: right;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .discord-section {
      margin-top: 40px;
    }

    .discord-section img {
      width: 40px;
      vertical-align: middle;
      cursor: pointer;
    }

    .error-msg {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>
      <span class="title-span">Gran</span> 
      <span class="title-span">Colombia</span> 
      <span class="title-span">RP</span>
    </h1>
    <div class="buttons">
      <button class="register-btn" onclick="openModal('register')">Registrarse</button>
      <button class="login-btn" onclick="openModal('login')">Iniciar sesión</button>
    </div>
  </header>

  <div class="container">
    <div class="info">By JonhScripts</div>
    <div class="info">Server en desarrollo</div>
    <div class="info">IP: <span class="highlight">mtasa://161.129.181.10:7036</span></div>

    <div class="welcome" id="welcomeMsg" style="display: none;"></div>

    <div class="discord-section">
      <p>Únete a nuestro Discord:</p>
      <img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png" alt="Discord" title="Copiar Discord" onclick="copyDiscord()">
    </div>
  </div>

  <!-- Modal (compartido para login y registro) -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle">Iniciar sesión</h2>
      <input type="text" id="usernameInput" placeholder="Usuario">
      <br>
      <input type="password" id="passwordInput" placeholder="Contraseña">
      <br>
      <button id="modalButton" onclick="handleAuth()">Entrar</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <script>
    let isRegister = false;

    function openModal(mode) {
      isRegister = (mode === 'register');
      document.getElementById("modalTitle").innerText = isRegister ? "Registrarse" : "Iniciar sesión";
      document.getElementById("modalButton").innerText = isRegister ? "Crear cuenta" : "Entrar";
      document.getElementById("errorMsg").innerText = "";
      document.getElementById("modal").style.display = "block";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    function handleAuth() {
      const user = document.getElementById("usernameInput").value.trim();
      const pass = document.getElementById("passwordInput").value.trim();
      const error = document.getElementById("errorMsg");

      if (!user || !pass) {
        error.innerText = "Completa todos los campos.";
        return;
      }

      if (isRegister) {
        if (localStorage.getItem(`user_${user}`)) {
          error.innerText = "Ese usuario ya existe.";
        } else {
          localStorage.setItem(`user_${user}`, pass);
          localStorage.setItem("current_user", user);
          showWelcome(user);
          closeModal();
        }
      } else {
        const savedPass = localStorage.getItem(`user_${user}`);
        if (savedPass && savedPass === pass) {
          localStorage.setItem("current_user", user);
          showWelcome(user);
          closeModal();
        } else {
          error.innerText = "Usuario o contraseña incorrectos.";
        }
      }
    }

    function showWelcome(user) {
      const msg = `Bienvenido de nuevo, ${user}!`;
      const welcome = document.getElementById("welcomeMsg");
      welcome.innerText = msg;
      welcome.style.display = "block";
    }

    function copyDiscord() {
      const discordLink = "https://discord.gg/ejemplo"; // Cambia esto por tu link real
      navigator.clipboard.writeText(discordLink).then(() => {
        alert("¡Link de Discord copiado!");
      });
    }

    window.onload = () => {
      const savedUser = localStorage.getItem("current_user");
      if (savedUser) showWelcome(savedUser);
    };
  </script>

</body>
</html>
