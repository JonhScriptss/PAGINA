<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nexx Host</title>
  <style>
    body {
      background-color: #0b0b0b;
      font-family: Arial, sans-serif;
      color: white;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #111;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: #00c3ff;
    }

    .login-btn {
      background-color: #00c3ff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      box-shadow: 0 0 10px #00c3ff;
    }

    .container {
      padding: 40px 20px;
      text-align: center;
    }

    .info {
      font-size: 1.1rem;
      margin: 10px 0;
    }

    .highlight {
      color: #00ffcc;
      font-weight: bold;
    }

    .welcome {
      margin-top: 30px;
      font-size: 1.3rem;
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffcc;
    }

    /* Modal panel */
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
    }

    .modal-content {
      background-color: #111;
      margin: 10% auto;
      padding: 30px;
      border: 1px solid #00c3ff;
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 0 15px #00c3ff;
      text-align: center;
    }

    input[type="text"], input[type="password"] {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
    }

    .modal button {
      background-color: #00c3ff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 10px #00c3ff;
    }

    .close {
      color: white;
      float: right;
      font-size: 1.2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Nexx Host</h1>
    <button class="login-btn" onclick="openModal()">Iniciar sesión</button>
  </header>

  <div class="container">
    <div class="info">By JonhScripts</div>
    <div class="info">Server en desarrollo</div>
    <div class="info">IP: <span class="highlight">mtasa://161.129.181.10:7036</span></div>

    <div class="welcome" id="welcomeMsg" style="display: none;"></div>
  </div>

  <!-- Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2>Iniciar sesión</h2>
      <input type="text" id="usernameInput" placeholder="Usuario">
      <br>
      <input type="password" id="passwordInput" placeholder="Contraseña">
      <br>
      <button onclick="loginUser()">Entrar</button>
    </div>
  </div>

  <script>
    // Modal logic
    function openModal() {
      document.getElementById("loginModal").style.display = "block";
    }

    function closeModal() {
      document.getElementById("loginModal").style.display = "none";
    }

    // Login (fake, with localStorage)
    function loginUser() {
      const user = document.getElementById("usernameInput").value.trim();
      const pass = document.getElementById("passwordInput").value.trim();

      if (user && pass) {
        localStorage.setItem("user", user);
        showWelcome(user);
        closeModal();
      }
    }

    function showWelcome(user) {
      const msg = `Bienvenido de nuevo, ${user}!`;
      const welcome = document.getElementById("welcomeMsg");
      welcome.innerText = msg;
      welcome.style.display = "block";
    }

    window.onload = () => {
      const savedUser = localStorage.getItem("user");
      if (savedUser) showWelcome(savedUser);
    };
  </script>

</body>
</html>
